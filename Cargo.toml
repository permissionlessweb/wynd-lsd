[workspace]
members = ["packages/*", "contracts/*"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "GPL 3.0"
repository = "https://github.com/cosmorama/wynd-lsd"

[workspace.dependencies]
anyhow = "1"
cosmwasm-schema = { path = "../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../ZK/cw/zk-cosmwasm/packages/std" }
cw2 = { path = "../ZK/cw/zk-cw-minus/packages/cw2" }
#cw20 = "2.0.0"
cw20 = { path = "../cw-plus/packages/cw20" }
#cw20-base = { version = "2.0.0", package = "cw20-base", features = ["library"] }
cw20-base = { path = "../cw-plus/contracts/cw20-base" }
cw-controllers = { path = "../ZK/cw/zk-cw-minus/packages/controllers" }
cw-multi-test = { path = "../cw-multi-test-fork" }
cw-placeholder = { path = "../wynddex/contracts/cw-placeholder" }

cw-storage-plus = { path = "../ZK/cw/zk-storage-plus" }
cw-utils = { path = "../ZK/cw/zk-cw-minus/packages/cw-utils" }
semver = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "1"
wynd-lsd-hub = { path = "contracts/lsd-hub" }
wyndex = { path = "../wynddex/packages/wyndex" }
wyndex-pair-lsd = { path = "../wynddex/contracts/pair_lsd" }
test-case = "3.0.0"

[profile.release.package.wynd-lsd-hub]
codegen-units = 1
incremental = false

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
strip = true
