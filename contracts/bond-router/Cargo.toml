[package]
name = "bond-router"
authors = ["Cosmorama <cosmorama@proton.me>"]
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw20 = { workspace = true }
cw-utils = { workspace = true }
thiserror = { workspace = true }
wynd-lsd-hub = { workspace = true }

wyndex = { path = "../../../wynddex/packages/wyndex" }
wyndex-factory = { path = "../../../wynddex/contracts/factory", features = ["library"] }
wyndex-pair-lsd = { path = "../../../wynddex/contracts/pair_lsd", features = ["library"] }
wyndex-stake = { path = "../../../wynddex/contracts/stake", features = ["library"] }

[dev-dependencies]
anyhow = { workspace = true }
cw-multi-test = { workspace = true }
cw20 = { workspace = true }
cw20-base = { workspace = true }
